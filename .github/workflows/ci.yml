# ==============================================================================
# Archivo: .github/workflows/ci.yml
# ==============================================================================
# Descripción:
#  Validación continua (CI) para AgenciAlquimia: en cada push a `main` y en
#  cada pull request se ejecutan typecheck, lint, tests de Next.js, tests de
#  Python Core (pytest) y build de producción.
# ==============================================================================

name: CI

on:
  push:
    branches: [main, python-core]
  pull_request:

jobs:
  validate:
    name: Validación (typecheck · lint · tests · build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias Node.js
        run: npm ci

      - name: Typecheck (TypeScript estricto)
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests Node.js (Vitest)
        run: npm test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias Python Core
        run: |
          sudo apt-get update && sudo apt-get install -y libpango1.0-dev libpangoft2-1.0-0 libcairo2
          cd services/python-core
          pip install --upgrade pip
          pip install . pytest pytest-asyncio

      - name: Tests Python Core (pytest)
        run: |
          cd services/python-core
          pytest tests/

      - name: Build de producción
        run: npm run build
