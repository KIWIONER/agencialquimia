<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradiente de Fondo Dark Charcoal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d10" />
      <stop offset="100%" stop-color="#04120e" />
    </linearGradient>

    <!-- Gradiente Neón Esmeralda a Menta -->
    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gradiente de Resplandor Central -->
    <radialGradient id="glowCore" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#047857" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Filtro de Resplandor Neón -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Contenedor Cuadrado con Bordes Redondeados (App Icon / Favicon) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" stroke-opacity="0.3" />

  <!-- Resplandor Ambiental Interior -->
  <circle cx="256" cy="270" r="180" fill="url(#glowCore)" />

  <!-- Grupo del Símbolo Alquímico & Red Neuronal IA -->
  <g filter="url(#neonGlow)">
    
    <!-- 1. Cuello y Boca del Matraz Alquímico -->
    <rect x="220" y="80" width="72" height="24" rx="12" fill="none" stroke="url(#emeraldNeon)" stroke-width="14" stroke-linecap="round" />
    <path d="M236 104V190" stroke="url(#emeraldNeon)" stroke-width="14" stroke-linecap="round" />
    <path d="M276 104V190" stroke="url(#emeraldNeon)" stroke-width="14" stroke-linecap="round" />

    <!-- 2. Cuerpo Facetado / Cristal Alquímico -->
    <path d="M236 190L130 350C116 372 132 400 158 400H354C380 400 396 372 382 350L276 190" 
          fill="none" stroke="url(#emeraldNeon)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" />

    <!-- 3. Facetas de Diamante / Prisma Inferior -->
    <path d="M158 400L256 310L354 400" fill="none" stroke="url(#emeraldNeon)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.8" />
    <path d="M130 350L256 310L382 350" fill="none" stroke="url(#emeraldNeon)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.7" />
    <path d="M256 190V310" fill="none" stroke="url(#emeraldNeon)" stroke-width="12" stroke-linecap="round" stroke-dasharray="4 12" />

    <!-- 4. Nódulo Neuronal IA Central Flotante (Hexágono + Núcleo) -->
    <polygon points="256,220 295,242 295,288 256,310 217,288 217,242" 
             fill="#0b0d10" stroke="#34d399" stroke-width="10" stroke-linejoin="round" />
    
    <!-- Núcleo de Energía IA -->
    <circle cx="256" cy="265" r="16" fill="#34d399" />
    
    <!-- Nodos Satélite Conectados -->
    <circle cx="256" cy="220" r="7" fill="#6ee7b7" />
    <circle cx="295" cy="242" r="7" fill="#6ee7b7" />
    <circle cx="295" cy="288" r="7" fill="#6ee7b7" />
    <circle cx="256" cy="310" r="7" fill="#6ee7b7" />
    <circle cx="217" cy="288" r="7" fill="#6ee7b7" />
    <circle cx="217" cy="242" r="7" fill="#6ee7b7" />

    <!-- 5. Destellos de Alquimia / Chispas Superiores -->
    <path d="M370 140L376 156L392 162L376 168L370 184L364 168L348 162L364 156Z" fill="#34d399" />
    <path d="M130 180L134 192L146 196L134 200L130 212L126 200L114 196L126 192Z" fill="#34d399" />
  </g>
</svg>
