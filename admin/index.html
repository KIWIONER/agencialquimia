<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alquimia | Control Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <aside class="sidebar">
      <div class="logo">
        Agenci<span>Alquimia</span>
      </div>
      <nav>
        <ul class="nav-menu">
          <li class="nav-item active">Dashboard</li>
          <li class="nav-item">Prospectos (Leads)</li>
          <li class="nav-item">IA Trainer</li>
          <li class="nav-item">Configuración</li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <header class="header">
        <h1>Dashboard General</h1>
        <div class="user-profile">
          Admin Alquimia
        </div>
      </header>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Leads</div>
          <div class="stat-value" id="total-leads">--</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Interacciones IA</div>
          <div class="stat-value">1,284</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Tasa Conversión</div>
          <div class="stat-value">12.4%</div>
        </div>
      </div>

      <section class="data-section">
        <div class="section-header">
          <h2>Últimos Leads (Transferidos)</h2>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Sector</th>
                <th>Contacto</th>
                <th>Estado</th>
                <th>Fecha</th>
              </tr>
            </thead>
            <tbody id="leads-body">
              <!-- Cargado via JS -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
